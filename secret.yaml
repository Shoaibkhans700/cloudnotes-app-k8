# DB credentials for CloudNotes.
#
# stringData is used here so the values are readable in plain text in this
# file for a portfolio/demo setup — Kubernetes base64-encodes them at apply
# time. Replace both values before applying, and never commit real
# credentials to source control. In a real environment, use a secrets
# manager (AWS Secrets Manager + External Secrets Operator, Sealed Secrets,
# SOPS, etc.) instead of a plain Secret manifest.
apiVersion: v1
kind: Secret
metadata:
  name: cloudnotes-secret
  namespace: cloudnotes-feature
type: Opaque
stringData:
  DB_USER: "notesuser"
  DB_PASSWORD: "ChangeMe-StrongPassword123!"
